[package]
name = "photocraft-android"
description = "PhotoCraft's Android entry point: the NativeActivity android_main trampoline that opens the shared app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# NativeActivity loads this library and calls its android_main.
crate-type = ["cdylib"]

# This crate deliberately does not inherit the workspace lints. Android's NativeActivity ABI
# requires an unmangled android_main export, and on edition 2024 that spelling
# (`#[unsafe(no_mangle)]`) trips rust's `unsafe_code` lint, which the workspace forbids — there is
# no safe spelling of a required export symbol. It also holds the one piece of real unsafe in the
# project: android_access.rs's JNI entry points to the activity's raw JVM (`JavaVM`/`JObject`
# `from_raw` have no safe form), needed to check and request the "All files access" grant — the
# unsafe stays in this entry trampoline, never in the shared photocraft/ui-egui crates, which
# receive plain closures instead. It therefore sets the workspace's *clippy* denials itself (every
# one of them, in `src/lib.rs`, so the scorecard's never-crash count sees them) and leaves
# `unsafe_code` alone.

[dependencies]
photocraft = { path = "../photocraft" }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# The NativeActivity handle the app's event loop needs; the same 0.6 instance eframe and winit
# use, so the handle passes across crates as one type.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
# The "All files access" grant (android_access.rs): same 0.21 instance cpal already pulls in.
jni = "0.21"

[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_name = "photocraft"
build_targets = ["aarch64-linux-android"]
# The launcher icon: `res/mipmap-<density>/ic_launcher.png`, regenerated from the app's own
# photocraft.svg by packaging/icons.sh (each PNG carries an attribution sidecar). cargo-apk runs
# `aapt package -S res`, which is what turns these into the APK's @mipmap/ic_launcher.
resources = "res"

# "All files access" (`MANAGE_EXTERNAL_STORAGE`): lets the in-app file browser reach shared
# storage (`/storage/emulated/0`) so a save, export, autosave folder or import can land outside
# the app-private directory. It is a special permission the app can never hold silently — the
# user grants it on the system settings page the browser opens (`android_access.rs`) — so the
# manifest entry alone changes nothing until they do.
#
# Android 9 has no such special permission: `android_access.rs` asks for the legacy runtime
# permission there instead, so both must be declared — Android denies a runtime request for an
# undeclared permission at once, without showing a dialog, and the browser's grant row would do
# nothing. `max_sdk_version = 29` keeps them off Android 11+, where the special permission
# replaces them. (Android 10 is declined in `capture()`: it enforces scoped storage for a
# `targetSdk` 35 app, and the opt-out, `requestLegacyExternalStorage`, is an application
# attribute cargo-apk 0.10 does not emit — see `docs/gaps.md` G18.)
uses_permission = [
    { name = "android.permission.MANAGE_EXTERNAL_STORAGE" },
    { name = "android.permission.READ_EXTERNAL_STORAGE", max_sdk_version = 29 },
    { name = "android.permission.WRITE_EXTERNAL_STORAGE", max_sdk_version = 29 },
]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "PhotoCraft"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
# Declared exhaustively. On OneUI (Android 16) a display sleep/wake flips a config bit the
# activity does not list, so the system relaunches the NativeActivity — and that relaunch can
# deadlock in the android-activity glue (the main thread waits in on_destroy while the native
# event-loop thread sleeps in its looper), stalling input to an ANR. The activity holds no Java
# resources (the app draws everything itself), so absorbing config changes natively is safe.
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|keyboard|navigation|touchscreen|locale|mcc|mnc|colorMode"
label = "PhotoCraft"
launch_mode = "singleTask"
orientation = "landscape"
exported = true
